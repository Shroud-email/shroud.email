# Depot CI Migration
# Source: .github/workflows/trivy.yml
#
# Changes made:
# - Changed runs-on from "blacksmith-2vcpu-ubuntu-2404" to "depot-ubuntu-latest" throughout

name: Trivy

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '27 7 * * 5'

permissions:
  contents: read

jobs:
  fs-scan:
    if: github.event_name == 'pull_request'
    name: Filesystem scan
    runs-on: depot-ubuntu-latest # was: blacksmith-2vcpu-ubuntu-2404. Nonstandard GitHub runner label detected, changed to default Depot runner.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # Temporary migration exception for imported dependency vulnerabilities.
          # Remove after website and Caddy dependency upgrades; keep app scanning enabled.
          skip-files: 'website/pnpm-lock.yaml,caddy-permissive-file-storage/go.mod'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Retain SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-filesystem-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
      - name: Upload Trivy scan results to GitHub Security tab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .depot/scripts/upload-sarif.mjs trivy-results.sarif . trivy-filesystem

  image-scan:
    if: github.event_name == 'schedule'
    name: Scheduled image scan
    runs-on: depot-ubuntu-latest # was: blacksmith-2vcpu-ubuntu-2404. Nonstandard GitHub runner label detected, changed to default Depot runner.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/shroud-email/shroud.email:edge
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Retain SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-scheduled-image-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
      - name: Upload Trivy scan results to GitHub Security tab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .depot/scripts/upload-sarif.mjs trivy-results.sarif . trivy-scheduled-image
