# Depot CI Migration
# Source: .github/workflows/sobelow.yml
#
# Changes made:
# - Pin the sandbox to Ubuntu 24.04 and supply setup-beam's ImageOS metadata

name: Sobelow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    working-directory: shroud.email

jobs:
  security-scan:
    permissions:
      contents: read
      security-events: write
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        env:
          # Depot does not supply GitHub runner-image metadata.
          ImageOS: ubuntu24
        with:
          elixir-version: "1.20.0"
          otp-version: "28"
      - name: Restore dependencies cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            shroud.email/deps
            shroud.email/_build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('shroud.email/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-
            ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run Sobelow
        # --private skips Sobelow's online "newer version?" check. That check
        # makes an :httpc call which crashes on OTP 28 (calls the removed
        # :http_util.timestamp/0), and it only fires intermittently (gated by a
        # 12h timestamp file in ~/.sobelow), so without this it fails flakily.
        run: mix sobelow --private --format sarif --out results.sarif
      - name: Retain SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sobelow-sarif
          path: shroud.email/results.sarif
          if-no-files-found: ignore
      - name: Upload report to GitHub Security
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .depot/scripts/upload-sarif.mjs shroud.email/results.sarif shroud.email sobelow
