name: Caddy module
on:
  push:
    branches: [ "main" ]
    paths:
      - 'caddy-permissive-file-storage/**'
      - '.github/workflows/caddy-deploy.yml'
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: caddy-permissive-file-storage

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: caddy-permissive-file-storage/go.sum
      - run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
      - run: go test -race ./...
      - run: bash test/e2e.sh

  deploy:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: shroud-email/caddy-permissive-file-storage
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - name: Log in to the container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Set up Depot
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Build container
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: 40gdpbrdf7
          context: caddy-permissive-file-storage
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
