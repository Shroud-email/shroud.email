# Fork PR fallback: Depot CI does not yet support fork pull requests.
name: Caddy module
on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: caddy-permissive-file-storage

jobs:
  test:
    name: Fork PR / test
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: caddy-permissive-file-storage/go.sum
      - run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
      - run: bash test/e2e.sh
