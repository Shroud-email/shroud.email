name: Amp CI repair

on:
  pull_request:
    paths:
      - '.github/workflows/amp-ci-repair.yml'
      - '.github/scripts/start-ci-repair*.mjs'
  workflow_run: # zizmor: ignore[dangerous-triggers] Only trusted main code runs; no upstream artifacts or caches are consumed.
    workflows:
      - CI
      - JavaScript and TypeScript formatting
      - Sobelow
      - GitHub Actions Security Analysis with zizmor 🌈
      - Build
      - Hosting images
      - Caddy module
      - Website production deployment
      - Tracker list deployment
      - release-please
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: amp-ci-repair-${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.run_attempt || github.run_attempt }}
  cancel-in-progress: false

jobs:
  test-launcher:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.8.0'
      - run: node --test .github/scripts/start-ci-repair.test.mjs

  start-repair:
    # Do not repeat an orb creation whose result may be ambiguous on a rerun.
    if: >-
      github.event_name == 'workflow_run' &&
      github.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted launcher code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.8.0'
      - name: Install Amp CLI
        run: npm install --global @ampcode/cli@0.0.1791121193-ge297b9
      - name: Start a fresh repair orb
        env:
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
        run: node .github/scripts/start-ci-repair.mjs
