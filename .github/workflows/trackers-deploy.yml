name: Tracker list deployment

on:
  push:
    branches: [main]
    paths:
      - 'email-trackers/**'
      - '.github/workflows/trackers-deploy.yml'
  workflow_dispatch:

# Avoid overlapping deploys racing to upload to the same storage zone.
concurrency:
  group: trackers-production
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: email-trackers

jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - run: node scripts/deploy-bunny.mjs
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.TRACKERS_BUNNY_STORAGE_PASSWORD }}
          BUNNY_PULLZONE_ID: ${{ secrets.TRACKERS_BUNNY_PULLZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
