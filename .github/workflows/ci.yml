name: CI
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    working-directory: shroud.email

jobs:
  site-adoption:
    name: Check website adoption
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Test staging and production bootstrap with mocked HTTP only
        working-directory: .
        run: node --test scripts/adopt-bunny-site.test.mjs

  test:
    runs-on: depot-ubuntu-24.04
    env:
      MIX_ENV: test
      LOOPS_API_KEY: secret
    services:
      postgres:
        image: index.docker.io/library/postgres@sha256:c4c7a1585974706b5f72b8ab595e47399b23b2e03d93bbf75c1b0904be1803dc # postgres:13.2-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: shroud_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.8.0"
      - name: Run assets JavaScript tests
        working-directory: shroud.email/assets
        run: |
          npm ci
          npm test
      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.20.0"
          otp-version: "28"
      - name: Restore dependencies cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            shroud.email/deps
            shroud.email/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('shroud.email/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
            ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Compile dependencies
        run: mix deps.compile
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run linter
        run: mix credo
      - name: Check warnings
        run: mix compile --warnings-as-errors
      - name: Check OpenAPI specification is in sync
        run: mix openapi.spec.json --spec ShroudWeb.ApiSpec --start-app=false --pretty=true --check=true openapi.json
      - name: Setup database
        run: mix ecto.setup
      - name: Run tests
        run: mix coveralls.json
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: shroud.email/cover/excoveralls.json
          token: ${{ secrets.CODECOV_TOKEN }}

  website:
    name: Build website and integrated documentation
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:content-images

  image-e2e:
    name: Production image E2E
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Depot
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Build production image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: 40gdpbrdf7
          context: shroud.email
          platforms: linux/amd64
          load: true
          tags: shroud-e2e-app
      - name: Run Playwright journeys
        run: E2E_SKIP_BUILD=1 bash scripts/run_e2e_tests.sh
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            shroud.email/e2e/playwright-report
            shroud.email/e2e/test-results
          if-no-files-found: ignore
