name: Website staging deployment

# Manual staging trial for the official Bunny site action. The attached Edge
# script is preserved unless its deployment is explicitly requested.
# Run it pointing at the branch you want to test — nothing touches prod.
#
# What it deploys:
#   1. Site build (dist/) → staging storage zone + cache purge
#   2. Optionally: Edge script (edge-script/dist/index.ts) → bunny edge scripting
#
# Required repo secrets:
#   WEBSITE_BUNNY_STAGING_SCRIPT_ID        - edge script id
#   WEBSITE_BUNNY_STAGING_DEPLOY_KEY       - edge script deploy key
#   BUNNY_API_KEY                          - shared account API key

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to deploy"
        required: true
        type: string
        default: "main"
      initialize_sites:
        description: "Initialize official CLI metadata on the existing staging pair (first run only)"
        type: boolean
        default: false
      deploy_edge_script:
        description: "Also replace the staging Edge script (otherwise preserve the attached script)"
        type: boolean
        default: false

# Prevent two runs from racing to upload to staging.
concurrency:
  group: website-staging
  cancel-in-progress: false

permissions: {}

jobs:
  deploy-site:
    name: Deploy site
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        working-directory: website
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Validate staging and protect geo-localized pricing
        run: node ../scripts/adopt-bunny-site.mjs
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          INITIALIZE_SITES: ${{ inputs.initialize_sites }}
          BUNNY_SITE_ENVIRONMENT: staging

      - name: Deploy staging with the official Bunny action
        uses: BunnyWay/actions/deploy-site@4b22fe0b319386b3913117daf97729409dd0a6ef # deploy-site_0.1.1
        with:
          site: "1687847"
          directory: website/dist
          api_key: ${{ secrets.BUNNY_API_KEY }}
          cli_version: "0.18.0"
          deployments: "false"
          environment: staging

      - name: Verify pricing cache protection after publication
        run: |
          for attempt in {1..12}; do
            if headers="$(curl --fail --silent --show-error --head --max-time 15 https://shroud-email-website-staging.b-cdn.net/pricing/)" &&
              printf '%s\n' "$headers" | grep -Eiq '^cache-control:.*no-store'; then
              echo "Pricing returns no-store at the workflow runner's CDN location."
              exit 0
            fi
            sleep 5
          done
          echo "Pricing cache protection not confirmed; publication already occurred. Check staging before retrying."
          exit 1

  deploy-edge-script:
    name: Deploy edge script
    needs: deploy-site
    if: inputs.deploy_edge_script
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Type-check
        working-directory: website/edge-script
        run: deno check src/main.ts

      - name: Bundle
        working-directory: website/edge-script
        run: deno task build

      - name: Deploy script to Bunny Edge Scripting
        uses: BunnyWay/actions/deploy-script@cfed0ba7842c85686d0dc3a83d8d971991a752f6 # deploy-script@0.5.0
        with:
          script_id: ${{ secrets.WEBSITE_BUNNY_STAGING_SCRIPT_ID }}
          deploy_key: ${{ secrets.WEBSITE_BUNNY_STAGING_DEPLOY_KEY }}
          file: website/edge-script/dist/index.ts

      - name: Verify complete pricing response after middleware publication
        run: curl --fail --silent --show-error --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null https://shroud-email-website-staging.b-cdn.net/pricing/
