name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'shroud.email/**'
      - '.github/workflows/build.yml'
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: depot-ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: shroud-email/shroud.email
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Need full history + tags so `git describe` can compute the release.
          fetch-depth: 0

      # Release identifier reported to Sentry, e.g. v1.2.0-4-gabcd123.
      # The same value is baked into the image and used to create the
      # matching release in Sentry (see the sentry-release job).
      - name: Compute release version
        id: version
        run: echo "version=$(git describe --first-parent --tags --match 'v[0-9]*' --always)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Depot
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha

      - name: Build & push (multi-arch)
        id: build
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: 40gdpbrdf7
          context: shroud.email
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SENTRY_RELEASE=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  scan:
    name: Trivy image scan
    needs: build
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: shroud-email/shroud.email
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image ref
        id: ref
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}"
          IMAGE_REF="${IMAGE_REF,,}@${DIGEST}"
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2
        with:
          sarif_file: 'trivy-results.sarif'

  sentry-release:
    name: Create Sentry release
    needs: build
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history + tags so `git describe` and commit association work.
          fetch-depth: 0

      - name: Compute release version
        id: version
        run: echo "version=$(git describe --first-parent --tags --match 'v[0-9]*' --always)" >> "$GITHUB_OUTPUT"
        shell: bash

      # Creates the release in Sentry, associates the commits since the last
      # release, finalizes it, and records a deploy in the "production"
      # environment. The version must match SENTRY_RELEASE baked into the image.
      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          release: ${{ steps.version.outputs.version }}
          environment: production
          set_commits: auto
