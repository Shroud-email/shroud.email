name: Documentation production deployment

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'shroud.email/**'
      - 'scripts/deploy-bunny.mjs'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Don't interrupt a clean deployment after the destination has been cleared.
concurrency:
  group: docs-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Build and deploy documentation
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    env:
      MIX_ENV: test
      LOOPS_API_KEY: secret
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: '1.20.0'
          otp-version: '28'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            shroud.email/deps
            shroud.email/_build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('shroud.email/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.MIX_ENV }}-
            ${{ runner.os }}-mix-
      - name: Generate OpenAPI specification from application source
        working-directory: shroud.email
        run: |
          mix deps.get
          mix openapi.spec.json --spec ShroudWeb.ApiSpec --start-app=false --pretty=true ../docs-site/public/openapi.json
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish documentation and purge CDN cache
        run: node ../scripts/deploy-bunny.mjs
        env:
          BUNNY_DIST: dist
          BUNNY_STORAGE_ZONE: ${{ vars.DOCS_BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.DOCS_BUNNY_STORAGE_PASSWORD }}
          BUNNY_PULLZONE_ID: ${{ secrets.DOCS_BUNNY_PULLZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
