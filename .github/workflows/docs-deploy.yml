name: Documentation production deployment

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'shroud.email/openapi.json'
      - 'shared/components/PostHog.astro'
      - 'scripts/deploy-bunny.mjs'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Don't interrupt a clean deployment after the destination has been cleared.
concurrency:
  group: docs-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Build and deploy documentation
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish documentation and purge CDN cache
        run: node ../scripts/deploy-bunny.mjs
        env:
          BUNNY_DIST: dist
          BUNNY_STORAGE_ZONE: ${{ vars.DOCS_BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.DOCS_BUNNY_STORAGE_PASSWORD }}
          BUNNY_PULLZONE_ID: ${{ secrets.DOCS_BUNNY_PULLZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
