[sign]
; Generate the EMAIL_DOMAIN key with config/dkim/dkim_key_gen.sh.
; Verified custom domains share this key via their shroudemail DKIM CNAME.
enabled=true
; Protect the app-generated RFC 8058 unsubscribe headers on forwarded mail.
headers=From,List-Unsubscribe,List-Unsubscribe-Post

[verify]
enabled=true
